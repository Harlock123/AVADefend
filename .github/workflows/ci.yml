name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Defender.slnx -c Release
      - name: Test (engine, persistence, audio mixer, Avalonia headless UI)
        run: dotnet test Defender.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/*.trx

  publish:
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, sc: true }
          - { os: ubuntu-latest, rid: linux-x64, sc: true }
          - { os: macos-latest, rid: osx-arm64, sc: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/Defender.Avalonia -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.sc }} -o publish/${{ matrix.rid }}
      - name: Self-test the packaged build (engine, renderer, native libs, data dir; audio/gamepad reported)
        shell: bash
        run: |
          if [ "${{ matrix.sc }}" = "false" ]; then
            dotnet publish/${{ matrix.rid }}/Defender.dll --selftest
          elif [ -f publish/${{ matrix.rid }}/Defender.exe ]; then
            publish/${{ matrix.rid }}/Defender.exe --selftest
          else
            publish/${{ matrix.rid }}/Defender --selftest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: defender-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
